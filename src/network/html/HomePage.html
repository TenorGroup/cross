<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tenor/cross</title>
    <style>
      .info-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px 0;
      }
      .info-row:last-child {
        border-bottom: none;
      }
      .label {
        font-weight: 600;
        color: var(--label-color);
      }
      .value {
        color: var(--title-color);
      }
      .status {
        display: inline-block;
        padding: 4px 12px;
        border-radius: 12px;
        background-color: var(--success-color);
        color: var(--button-text);
        font-size: 0.9em;
      }
    </style>
  <link rel="stylesheet" href="/assets/web.css" />
  <link rel="stylesheet" href="/theme.css" />
  </head>
  <body class="web-ui tenor-transfer">
    <!--#include file="shared/Header.html.inc" -->
<main class="page-content">


    <div class="card">
      <h2 data-i18n="home.device">Thiết bị</h2>
      <div class="info-row">
        <span class="label" data-i18n="home.serial">Số máy</span>
        <span class="value" id="serial"></span>
      </div>
      <div class="info-row">
        <span class="label" data-i18n="home.version">Phiên bản</span>
        <span class="value" id="version"></span>
      </div>
      <div class="info-row">
        <span class="label" data-i18n="home.wifi">Kết nối Wi-Fi</span>
        <span class="status" data-i18n="home.wifiConnected">Đã kết nối</span>
      </div>
      <div class="info-row">
        <span class="label" data-i18n="home.ip">Địa chỉ IP</span>
        <span class="value" id="ip-address"></span>
      </div>
      <div class="info-row">
        <span class="label" data-i18n="home.freeHeap">Bộ nhớ trống</span>
        <span class="value" id="free-heap"></span>
      </div>
    </div>

    </main>
<!--#include file="shared/Footer.html.inc" -->
  <script>
    TenorI18n.init();

    let lastStatus = null;

    function renderStatus() {
      if (!lastStatus) return;
      document.getElementById('version').textContent = lastStatus.version || TenorI18n.t('common.na');
      document.getElementById('serial').textContent = lastStatus.serial || TenorI18n.t('common.na');
      document.getElementById('ip-address').textContent = lastStatus.ip || TenorI18n.t('common.na');
      document.getElementById('free-heap').textContent = Number.isFinite(lastStatus.freeHeap)
        ? TenorI18n.t('common.bytes', { value: TenorI18n.formatNumber(lastStatus.freeHeap) })
        : TenorI18n.t('common.na');
    }

    async function fetchStatus() {
      try {
        const response = await fetch(TenorI18n.apiUrl('/api/status'));
        if (!response.ok) {
          throw new Error('Failed to fetch status: ' + response.status + ' ' + response.statusText);
        }
        lastStatus = await response.json();
        renderStatus();
      } catch (error) {
        console.error('Error fetching status:', error);
      }
    }

    // A locale change re-renders the values already fetched; it never refetches
    // and never restarts anything in flight.
    TenorI18n.onChange(renderStatus);

    // Fetch status on page load
    fetchStatus();
  </script>
  </body>
</html>
