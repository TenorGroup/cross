; ---------------------------------------------------------------------------
; Simulator: builds the firmware natively and draws the e-ink panel in an SDL2
; window, so a UI change can be looked at without flashing a device. Needs
; `brew install sdl2` on macOS. Upstream: crosspoint-reader/crosspoint-simulator.
; ---------------------------------------------------------------------------
[env:simulator]
platform = native
lib_ldf_mode = deep+
lib_compat_mode = off
build_src_filter =
  +<*>
  ; Firmware-update code stays non-destructive here.
  -<network/FirmwareFlasher.cpp>
  -<network/OtaBootSwitch.cpp>
  -<network/OtaUpdater.cpp>
  -<platform/skip_efuse_blk_check.c>
build_flags =
  -std=gnu++2a
  !sdl2-config --cflags --libs
  -Wno-c++11-narrowing
  -D_LIBCPP_DISABLE_AVAILABILITY
  -DSIMULATOR
  ; Keep String JSON adapters identical across translation units and include orders.
  -DARDUINOJSON_ENABLE_ARDUINO_STRING=1
  -DFREEINK_DEVICE_X4=1
  -DCROSSPOINT_SIMULATOR_PROJECT_WEBSERVER
  -DCROSSPOINT_VERSION=\"dev-simulator\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  -DMINIZ_NO_ZLIB_COMPATIBLE_NAMES=1
  -DXML_GE=0
  -DXML_CONTEXT_BYTES=1024
  -DUSE_UTF8_LONG_NAMES=1
  -DPNG_MAX_BUFFERED_PIXELS=16416
  -DMAX_WIDTH=3072
  -DDISABLE_FS_H_WARNING=1
  -DDESTRUCTOR_CLOSES_FILE=1
  -Isrc
  -Ifreeink-sdk/libs/hardware/SDCardManager/include
  ; BleRemoteProfiles.h, which BlePageTurner's BleKeyBinding.h includes (header only, no BLE stack).
  -Ifreeink-sdk/libs/network/BleKeyboardHost/include
lib_ignore = hal, PNGdec, JPEGDEC, WebSockets, SecureNet
extra_scripts =
  pre:scripts/reproducible_paths.py
  pre:scripts/fetch_freetype.py
  pre:scripts/verify_chinese_fonts.py
  pre:scripts/patch_animatedgif.py
  pre:scripts/patch_simulator_grayscale.py
  pre:scripts/patch_simulator_input_timing.py
  pre:scripts/patch_simulator_clock.py
  pre:scripts/patch_simulator_tilt.py
  pre:scripts/patch_simulator_usb.py
  pre:scripts/patch_simulator_security.py
  pre:scripts/patch_simulator_panel_trace.py
  pre:scripts/patch_simulator_sd_trace.py
  pre:scripts/patch_simulator_free_space.py
  pre:scripts/patch_simulator_power.py
  pre:scripts/patch_simulator_wake.py
  pre:scripts/patch_simulator_stroke.py
  pre:scripts/patch_simulator_panic.py
  pre:scripts/patch_simulator_gaps.py
  pre:scripts/gen_i18n.py
  pre:scripts/git_branch.py
  pre:scripts/build_html.py
lib_deps =
  simulator=https://github.com/crosspoint-reader/crosspoint-simulator#ecc4784fc177f77bfcffb12b793b07282d29dbd4
  FreeInkUI=symlink://freeink-sdk/libs/ui/FreeInkUI
  Icons=symlink://freeink-sdk/libs/assets/Icons
  FreeInkFont=symlink://freeink-sdk/libs/font/FreeInkFont
  ; The CrossPoint 2.0.0 libraries the reader and catalogs include (XmlParserUtils.h, the streaming JSON parser,
  ; catalog lists, protected books). SecureNet stays ignored: no HTTPS in the simulator.
  JsonSax=symlink://freeink-sdk/libs/network/JsonSax
  Opds=symlink://freeink-sdk/libs/network/Opds
  CatalogList=symlink://freeink-sdk/libs/network/CatalogList
  ContentProtection=symlink://freeink-sdk/libs/book/ContentProtection
  bblanchon/ArduinoJson @ 7.4.2
  ricmoo/QRCode @ ^0.0.1
  ; The same pin as the firmware: scripts/patch_animatedgif.py is reviewed for it.
  https://github.com/bitbank2/AnimatedGIF.git#67cfacafe12ef4926c7713342c57d2a4af040e5e
  links2004/WebSockets @ 2.7.3

[env:simulator_x3]
extends = env:simulator
build_flags =
  ${env:simulator.build_flags}
  -DSIMULATOR_DEVICE_X3
  -DFREEINK_DEVICE_X3=1

; The X3 on hand reports UC8279 at boot (XTDET promoted UC8253 -> UC8279).
[env:simulator_x3_uc8279]
extends = env:simulator_x3
build_flags =
  ${env:simulator_x3.build_flags}
  -DSIMULATOR_DISPLAY_UC8279

; X4 Pro touch screens (480 x 800 portrait, TAP and SWIPE in the input script).
[env:simulator_x4pro]
extends = env:simulator
build_flags =
  ${env:simulator.build_flags}
  -DSIMULATOR_DEVICE_X4_PRO
  -DBOARD_HAS_PSRAM
  -DFREEINK_DEVICE_X4PRO=1
  -DTENOR_CABLE_FLASH=1

; Hardware-only acceptance build. Never publish its binary on the stable channel.
[env:ota_acceptance]
extends = env:gh_release_rc
build_flags =
  ${env:gh_release_rc.build_flags}
  -DTENOR_OTA_ACCEPTANCE

