; Journey-suite measurement builds (tools/hanh-trinh). Kept in git so every release measures with the
; same flags: the release env plus the cable probe (TENOR_PRESS_PROBE, TENOR_UI_ACCEPTANCE, the BLE probe
; lines), the cut measurement buffers (TENOR_PROBE_LITE) and the heap-floor marks (TENOR_HEAP_FLOOR).
; The X4 Pro one builds on env:x4pro-probe, the profile that unit runs between measurements. Names start
; with m- so platformio.local.ini cannot merge into them by accident.
[env:m-x3]
extends = env:gh_release
build_flags =
  ${env:gh_release.build_flags}
  -DTENOR_PRESS_PROBE
  -DTENOR_UI_ACCEPTANCE
  -DBLE_PAGE_TURNER_PROBE
  -DBLE_PAGE_TURNER_STACK_PROBE
  -DTENOR_PROBE_LITE
  -DTENOR_HEAP_FLOOR
  -DTENOR_HYPH_NO_DE  ; the probe code does not fit the 128 KiB headroom with German patterns (flash only)

[env:m-x4c]
extends = env:x4c-gh_release
build_flags =
  ${env:x4c-gh_release.build_flags}
  -DTENOR_PRESS_PROBE
  -DTENOR_UI_ACCEPTANCE
  -DBLE_PAGE_TURNER_PROBE
  -DBLE_PAGE_TURNER_STACK_PROBE
  -DTENOR_PROBE_LITE
  -DTENOR_HEAP_FLOOR
  -DTENOR_HYPH_NO_DE  ; as m-x3: flash only, kept so .68 and .69 measure alike

[env:m-x4pro]
extends = env:x4pro-probe
build_flags =
  ${env:x4pro-probe.build_flags}
  -DTENOR_UI_ACCEPTANCE
  -DBLE_PAGE_TURNER_STACK_PROBE
  -DTENOR_PROBE_LITE
  -DTENOR_HEAP_FLOOR
