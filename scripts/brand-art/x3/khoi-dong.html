<!doctype html>
<meta charset="utf-8">
<meta name="tenor-brand-version" content="1.3.0">
<title>tenor/cross - Xteink X3 - khởi động</title>
<!--
  Ấn phẩm: màn KHỞI ĐỘNG cho Xteink X3 chạy tenor/cross. Khổ 528 x 792, đúng khổ panel.

  DẢI CHUYỂN TÔNG CHẠY NGƯỢC MÀN NGỦ. Màn ngủ là mực dâng từ đáy lên; mặt này là mực rút
  từ đỉnh xuống. Hai mặt thành một cặp, cầm máy lên là biết ngay nó đang bật hay đang ngủ.

  DẢI PHẢI DÀI MỚI MƯỢT. Panel chỉ có 4 nấc nên chuyển tông ở đây là hạt rắc, và hạt rắc
  cần quãng dài mới tãi ra được. Bản 15/09 sáng ép dải vào 170 điểm ảnh thì nó dồn thành
  sọc, founder bác. Dải hiện tại chạy 317 điểm ảnh, cùng cỡ với màn ngủ.

  BA BẬC CỦA MARK (founder chốt 15/09/2026). Đây đúng là thang lockup của brand dịch sang
  bốn nấc panel: `t` là không gian tên nên lùi MỘT nấc (85), `/` là dấu ngăn nên lùi HAI
  nấc (170), `+` là tiêu điểm nên đen đặc (0). Ba bậc này chỉ đọc được khi mark nằm trên
  giấy trắng, nên mark đặt hẳn dưới chỗ dải đã tãi hết.

  Lưu ý một lập luận SAI đã dùng và đã bỏ: "ít mực cho vẽ nhanh". Giấy điện tử vẽ lại toàn
  màn tốn thời gian như nhau bất kể lượng mực, thời gian nằm ở dạng sóng chứ không nằm ở
  nội dung.

  BĂNG CHỪA CHÂN MÀN. Firmware tự vẽ dòng phiên bản ở `pageHeight - 30`, tức y = 762
  (BootActivity.cpp:17). Từ y = 736 xuống đáy để trắng, không hạt.
-->

  @font-face { font-family:"Geist"; font-weight:500;
    src:url("fonts/Geist-Medium.ttf"); }

  html, body { margin:0; padding:0; }
  body { width:528px; height:792px; background:#FFFFFF; overflow:hidden; }
  .sheet { position:absolute; inset:0; }

  /* Mực rút từ đỉnh xuống, tãi hết trước khi tới mark. */
  .muc {
    position:absolute; inset:0;
    background:linear-gradient(180deg,
      #000000 0%, #000000 10%, #0E0E0E 16%, #2A2A2A 22%,
      #545454 28%, #7E7E7E 34%, #A8A8A8 40%, #D2D2D2 45%,
      #F2F2F2 48%, #FFFFFF 50%, #FFFFFF 100%);
  }

  .col { position:absolute; left:61px; width:406px; }

  .lockup { font-family:"Geist",sans-serif; font-weight:500; font-size:80px;
            line-height:1; letter-spacing:-0.045em; color:#FFFFFF; white-space:nowrap; }
  .lockup .ns { color:#808080; } .lockup .sl { color:#4D4D4D; }

  .sym { position:absolute; left:10px; top:392px; width:508px; height:306px; }
  /* Mark viết tắt t/+, founder đặt 15/09/2026: dấu + vừa là chữ đầu của cross vừa là hình
     chữ thập. Dựng bằng chữ sống Geist Medium; bộ logo chưa có bản outline cho mark này. */
  .sym-chu { font-family:"Geist",sans-serif; font-weight:500; font-size:252px;
             letter-spacing:-0.05em; }

  /* Dòng trạng thái để ĐEN TUYỆT ĐỐI. Nấc 85 và 170 nuốt mất nét mảnh. */
  .trang-thai { position:absolute; left:0; right:0; top:712px; text-align:center;
                font-family:"Geist",sans-serif; font-weight:500; font-size:34px;
                line-height:1; letter-spacing:0.02em; color:#000000; }
</style>
