<!doctype html>
<meta charset="utf-8">
<meta name="tenor-brand-version" content="1.3.0">
<title>tenor/cross - Xteink X3 - mực dâng</title>
<!--
  Ấn phẩm: màn nền cho Xteink X3 chạy tenor/cross. Khổ 528 x 792, đúng khổ panel.
  Mặt "mực dâng": mực dâng từ đáy lên, khối chữ nằm trên phần giấy còn trắng.

  DẢI CHUYỂN TÔNG. Panel chỉ có 4 mức xám, nên dải chuyển tông ở đây là hạt rắc chứ
  không phải tông phẳng. build.py chạy đúng hàm applyBayerDither4Level của firmware
  (Bayer 4x4 biên độ +-40, cắt nấc ở 64, 128, 192), nên ảnh xem trước bằng đúng máy thật.

  SYMBOL MANG GRADIENT NGƯỢC (founder chốt 15/09/2026). Symbol không tô một tông, nó tô
  một dải chạy NGƯỢC chiều dải của nền: nền sáng thì symbol tối, nền tối thì symbol sáng.
  Dải này chuyển MƯỢT suốt chiều cao mark, không có bước nhảy (founder chốt 15/09: bước
  nhảy đọc ra là cắt dán). Cái giá phải trả: đúng chỗ hai dải bằng nhau, chừng 40 tới 50
  điểm ảnh giữa mark, silhouette tan vào nền. Đó là hệ quả của phép đảo mượt trên panel
  chỉ có 4 nấc, không phải lỗi dựng.

  KHÔNG có dòng đường dẫn và KHÔNG có nét kẻ ngang (founder bỏ 15/09/2026).
  Lockup tenor/cross dựng bằng chữ sống Geist Medium. Bộ logo CHƯA có bản outline cho
  tenor/cross; dựng bản đó là việc riêng của print-readiness, chưa làm.
-->

  .sheet { position:absolute; inset:0; }

  .muc {
    position:absolute; inset:0;

  .col { position:absolute; left:61px; width:406px; }

            line-height:1; letter-spacing:-0.045em; color:#000000; white-space:nowrap; }
  /* Nấc 85 cho namespace. Nấc 170 rắc quá thưa, chữ đọc ra lấm tấm. */
  .lockup .ns { color:#808080; } .lockup .sl { color:#B3B3B3; }

  .dong-phu { font-family:"Geist",sans-serif; font-weight:400; font-size:25px;
              line-height:1.42; letter-spacing:0.005em; color:#000000; }

  .symclip { position:absolute; inset:0; overflow:hidden; }
  .sym { position:absolute; left:116px; top:382px; width:400px; height:260px; }
  /* Mark viết tắt t/x, founder đặt 15/09/2026: x vừa là chữ đầu của cross vừa là hình

  .sym-chu { font-family:"Geist",sans-serif; font-weight:500; font-size:210px;
             letter-spacing:-0.05em; }

  .chan { font-family:"Geist",sans-serif; font-weight:400; font-size:19px;
          line-height:1; letter-spacing:0.12em; color:#FFFFFF; }
  .chanrow { display:flex; justify-content:space-between; }
</style>
